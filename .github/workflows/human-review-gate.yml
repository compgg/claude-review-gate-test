name: Human Review Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and report
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          REQUIRED_HUMAN_APPROVALS: 1
        run: |
          if [ "$AUTHOR_TYPE" != "Bot" ]; then
            state=success
            desc="Author '$AUTHOR' is human — no extra requirement."
          else
            approvals=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate --jq '
              [ .[]
                | select(.user.type != "Bot")
                | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
              ]
              | group_by(.user.login) | map(last)
              | map(select(.state == "APPROVED")) | length')
            if [ "$approvals" -ge "$REQUIRED_HUMAN_APPROVALS" ]; then
              state=success
              desc="Bot author '$AUTHOR': $approvals/$REQUIRED_HUMAN_APPROVALS human approvals."
            else
              state=failure
              desc="Bot author '$AUTHOR': $approvals/$REQUIRED_HUMAN_APPROVALS human approvals — needs more."
            fi
          fi
          echo "$desc"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context=human-review-gate -f description="$desc" > /dev/null
