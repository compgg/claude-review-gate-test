name: Human Review Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  pull-requests: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  human-review-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          REQUIRED_HUMAN_APPROVALS: 1
        run: |
          if [ "$AUTHOR_TYPE" != "Bot" ]; then
            echo "PR author '$AUTHOR' is a human — gate passes with no extra requirement."
            exit 0
          fi
          approvals=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate --jq '
            [ .[]
              | select(.user.type != "Bot")
              | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
            ]
            | group_by(.user.login) | map(last)
            | map(select(.state == "APPROVED")) | length')
          echo "PR author '$AUTHOR' is a bot — $approvals human approval(s) found, $REQUIRED_HUMAN_APPROVALS required."
          if [ "$approvals" -lt "$REQUIRED_HUMAN_APPROVALS" ]; then
            echo "Gate FAILS until enough humans approve."
            exit 1
          fi
          echo "Gate passes."
